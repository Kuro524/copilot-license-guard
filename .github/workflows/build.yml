name: Build VSIX

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile
        run: npm run compile

      - name: Test
        run: npm test

      # タグと package.json のバージョンが食い違ったまま Release を作らない
      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "v${PKG_VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${PKG_VERSION}"
            exit 1
          fi

      # バージョンに -nightly を含むビルドは試験版(pre-release)として扱う
      - name: Detect nightly
        id: channel
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          case "${PKG_VERSION}" in
            *-nightly*) echo "nightly=true"  >> "${GITHUB_OUTPUT}"; echo "試験版ビルド: ${PKG_VERSION}" ;;
            *)          echo "nightly=false" >> "${GITHUB_OUTPUT}" ;;
          esac

      - name: Package VSIX
        run: |
          if [ "${{ steps.channel.outputs.nightly }}" = "true" ]; then
            npx --yes @vscode/vsce@4 package --pre-release --out copilot-license-guard.vsix
          else
            npx --yes @vscode/vsce@4 package --out copilot-license-guard.vsix
          fi

      # .vscodeignore の漏れ(スクリプトや CI 定義の混入)を目視確認できるようにする
      - name: List VSIX contents
        run: npx --yes @vscode/vsce@4 ls

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: copilot-license-guard-vsix
          path: copilot-license-guard.vsix

      # タグ push 時のみ Release を作成して VSIX を添付する。
      # 本文はインストール手順(テンプレート) + 自動生成されたリリースノート。
      # 試験版は --prerelease で作成し、releases/latest(安定版の導線)には載せない。
      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.channel.outputs.nightly }}" = "true" ]; then
            TEMPLATE=.github/release-notes-nightly.md
            EXTRA=(--prerelease --title "${GITHUB_REF_NAME}（試験版 / nightly）")
          else
            TEMPLATE=.github/release-notes.md
            EXTRA=(--title "${GITHUB_REF_NAME}")
          fi
          sed "s/{{VERSION}}/${GITHUB_REF_NAME}/g" "${TEMPLATE}" > "${RUNNER_TEMP}/notes.md"
          gh release create "${GITHUB_REF_NAME}" copilot-license-guard.vsix \
            "${EXTRA[@]}" \
            --notes-file "${RUNNER_TEMP}/notes.md" \
            --generate-notes
