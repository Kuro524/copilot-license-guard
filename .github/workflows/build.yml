name: Build VSIX

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile
        run: npm run compile

      - name: Package VSIX
        run: npx --yes @vscode/vsce package --out copilot-license-guard.vsix

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: copilot-license-guard-vsix
          path: copilot-license-guard.vsix

      # タグ push 時のみ Release を作成して VSIX を添付する
      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" copilot-license-guard.vsix --generate-notes
